{% extends "base.html" %}

{% block content %}
<table class="my-table"> <tr>
        <th>Name</th>
        <th>Location</th>
        <th>Price</th>   </tr>

    {% for p in product_list %}
    <tr>
        <td>{{ p.name }}</td>
        <td>{{ p.location }}</td>
        <td>{{ p.price }} €</td>  </tr>
    {% endfor%}
</table>
{% endblock %}
